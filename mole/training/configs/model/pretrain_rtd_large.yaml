# @package _global_
# MolE-Large RTD on the existing ZINC20 1.5B parquet corpus.
# Fresh pretraining only: the 1024-wide model cannot load 768-wide checkpoints.

name_sufix: pretrain_rtd_large
submit_job: true
keep_configs: false
checkpoint_path: null

logger:
  _target_: pytorch_lightning.loggers.CSVLogger
  save_dir: /mnt/logs
  name: mole_rtd_large_1.5b

model:
  name: mole_pretrain_rtd_large_1.5b
  data:
    trainer:
      _target_: pytorch_lightning.Trainer
      accelerator: gpu
      devices: 4
      strategy: ddp_find_unused_parameters_true
      precision: bf16-mixed
      max_steps: 6015625
      accumulate_grad_batches: 2
      log_every_n_steps: 100
      num_sanity_val_steps: 2
      gradient_clip_val: 1.0
      val_check_interval: 50000
      limit_val_batches: 200
      use_distributed_sampler: false
      benchmark: true
      callbacks:
        # Rolling full state for optimizer/scheduler-safe recovery.
        - _target_: pytorch_lightning.callbacks.ModelCheckpoint
          dirpath: /mnt/checkpoints/rtd_large_1.5b/resume
          every_n_train_steps: 10000
          save_top_k: 0
          save_last: true
          monitor: null
          filename: "large-resume-{step}"
          verbose: true
          save_weights_only: false
        # Sparse weights-only snapshots for learning curves and fixed probes.
        - _target_: pytorch_lightning.callbacks.ModelCheckpoint
          dirpath: /mnt/checkpoints/rtd_large_1.5b/milestones
          every_n_train_steps: 500000
          save_top_k: -1
          save_last: false
          monitor: null
          filename: "large-{step}"
          verbose: true
          save_weights_only: true
        # Select only on held-out pretraining loss, never TDC test scores.
        - _target_: pytorch_lightning.callbacks.ModelCheckpoint
          dirpath: /mnt/checkpoints/rtd_large_1.5b/best
          save_top_k: 2
          save_last: false
          mode: min
          monitor: val_mean_loss
          filename: "large-{step}-{val_mean_loss:.5f}"
          verbose: true
          save_weights_only: true
        - _target_: pytorch_lightning.callbacks.TQDMProgressBar
          refresh_rate: 50
      plugins:
        _target_: lightning_fabric.plugins.environments.TorchElasticEnvironment

  hyperparameters:
    random_seed: 42
    datamodule:
      _target_: mole.training.data.pretrain_datasets.MolPreTrainDataModule
      data: /mnt/data/zinc20_1.5b
      vocabulary_inp: vocabulary_207atomenvs_radius0_ZINC_guacamole.pkl
      mask_prob: 0.25
      batch_size: 32
      num_workers: 8
      val_num_workers: 0
      max_atoms: 96

    pl_module:
      _target_: mole.training.models.pretrain.MolEPreTrain
      checkpoint_path: ${checkpoint_path}
      model:
        _target_: mole.training.models.pretrain.MolERTDModel
        vocab_size_inp: null
        mask_token_id: null
        rtd_lambda: 50.0
        embedding_sharing: gdes

        # 1/4 discriminator depth and 3/8 width: small but not trivial.
        gen_deberta_config:
          embedding_size: 1024
          hidden_size: 384
          intermediate_size: 1536
          num_hidden_layers: 6
          num_attention_heads: 6
          attention_head_size: 64
          attention_probs_dropout_prob: 0.1
          hidden_dropout_prob: 0.1
          hidden_act: gelu
          layer_norm_eps: 1.0e-7
          max_position_embeddings: 512
          max_relative_positions: 512
          position_buckets: 0
          norm_rel_ebd: layer_norm
          pos_att_type: p2c|c2p
          position_biased_input: false
          relative_attention: true
          share_att_key: true
          type_vocab_size: 0
          vocab_size: 130505

        # DeBERTa/ELECTRA-Large dimensions; this is the downstream encoder.
        disc_deberta_config:
          embedding_size: 1024
          hidden_size: 1024
          intermediate_size: 4096
          num_hidden_layers: 24
          num_attention_heads: 16
          attention_head_size: 64
          attention_probs_dropout_prob: 0.1
          hidden_dropout_prob: 0.1
          hidden_act: gelu
          layer_norm_eps: 1.0e-7
          max_position_embeddings: 512
          max_relative_positions: 512
          position_buckets: 0
          norm_rel_ebd: layer_norm
          pos_att_type: p2c|c2p
          position_biased_input: false
          relative_attention: true
          share_att_key: true
          type_vocab_size: 0
          vocab_size: 130505

      optimizer:
        _target_: torch.optim.AdamW
        _partial_: true
        lr: 5.0e-5
        betas: [0.9, 0.999]
        eps: 1.0e-6
        weight_decay: 0.01
      lr_scheduler:
        _target_: mole.training.utils.schedulers.get_cosine_schedule_with_warmup
        _partial_: true
        num_warmup_steps: 10000
        num_training_steps: 6015625
      metrics:
        _target_: mole.training.utils.metrics.MetricsDict
