# @package _global_
# RTD (Replaced Token Detection) pre-training config for MolE.
# Generator = 1/3-depth, 1/3-width DeBERTa. Discriminator = full MolE.
# Run via: mole_train model=pretrain_rtd

name_sufix: pretrain_rtd
submit_job: True
keep_configs: False
checkpoint_path: null

logger:
  _target_: pytorch_lightning.loggers.CSVLogger
  save_dir: /mnt/logs
  name: mole_rtd

model:
  name: mole_pretrain_rtd

  data:
    trainer:
      _target_: pytorch_lightning.Trainer
      accelerator: gpu
      devices: -1
      strategy: ddp
      precision: 16
      max_steps: 1000000
      log_every_n_steps: 100
      num_sanity_val_steps: 2
      gradient_clip_val: 1.0
      val_check_interval: 5000
      use_distributed_sampler: false
      benchmark: true
      callbacks:
        - _target_: pytorch_lightning.callbacks.ModelCheckpoint
          dirpath: /mnt/checkpoints
          every_n_train_steps: 10000
          save_top_k: 3
          save_last: true
          mode: min
          monitor: val_mean_loss
          filename: "mole_rtd-{step}-{val_mean_loss:.4f}"
          verbose: true
          save_weights_only: true
        - _target_: pytorch_lightning.callbacks.TQDMProgressBar
          refresh_rate: 50
      plugins:
        _target_: lightning_fabric.plugins.environments.TorchElasticEnvironment

  hyperparameters:
    datamodule:
      _target_: mole.training.data.pretrain_datasets.MolPreTrainDataModule
      data: /nfs/user/s3028970-eidf107/mole-rtd/data/pretrain_smiles_train.csv
      validation_data: /nfs/user/s3028970-eidf107/mole-rtd/data/pretrain_smiles_val.csv
      vocabulary_inp: vocabulary_207atomenvs_radius0_ZINC_guacamole.pkl
      radius_inp: 0
      useFeatures_inp: false
      mask_prob: 0.15
      val_fraction: 0.01
      batch_size: 256
      num_workers: 8

    pl_module:
      _target_: mole.training.models.pretrain.MolEPreTrain
      checkpoint_path: ${checkpoint_path}

      model:
        _target_: mole.training.models.pretrain.MolERTDModel
        vocab_size_inp: null             # filled at runtime from datamodule.dictionary_inp
        mask_token_id: null              # filled at runtime from datamodule.dictionary_inp
        rtd_lambda: 50.0
        embedding_sharing: gdes

        # ── Generator (small: 3 layers, hidden=256, embedding_size=768) ──────
        gen_deberta_config:
          embedding_size: 768            # MUST match disc so GDES weight sharing works
          hidden_size: 256
          intermediate_size: 1024
          num_hidden_layers: 3
          num_attention_heads: 4
          attention_head_size: 64
          attention_probs_dropout_prob: 0.1
          hidden_dropout_prob: 0.1
          hidden_act: gelu
          layer_norm_eps: 1.0e-7
          max_position_embeddings: 0
          max_relative_positions: 64
          position_buckets: 0
          norm_rel_ebd: layer_norm
          pos_att_type: p2c|c2p
          position_biased_input: false
          relative_attention: true
          share_att_key: true
          type_vocab_size: 0
          vocab_size: 130505            # overridden by vocab_size_inp at runtime

        # ── Discriminator (full MolE: 12 layers, hidden=768) ─────────────────
        disc_deberta_config:
          embedding_size: 768
          hidden_size: 768
          intermediate_size: 3072
          num_hidden_layers: 12
          num_attention_heads: 12
          attention_head_size: 64
          attention_probs_dropout_prob: 0.1
          hidden_dropout_prob: 0.1
          hidden_act: gelu
          layer_norm_eps: 1.0e-7
          max_position_embeddings: 0
          max_relative_positions: 64
          position_buckets: 0
          norm_rel_ebd: layer_norm
          pos_att_type: p2c|c2p
          position_biased_input: false
          relative_attention: true
          share_att_key: true
          type_vocab_size: 0
          vocab_size: 130505

      optimizer:
        _target_: torch.optim.AdamW
        _partial_: true
        lr: 1.0e-4
        betas: [0.9, 0.999]
        eps: 1.0e-6
        weight_decay: 0.01

      lr_scheduler:
        _target_: mole.training.utils.schedulers.get_constant_schedule_with_warmup
        _partial_: true
        num_warmup_steps: 10000

      metrics:
        _target_: mole.training.utils.metrics.MetricsDict
