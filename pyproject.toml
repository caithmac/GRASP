[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-molecular"
version = "0.1.0"
description = "GRASP molecular graph encoder and downstream property fine-tuning"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.1,<3",
  "torch-geometric>=2.4,<3",
  "rdkit>=2023.3",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scipy>=1.10",
  "scikit-learn>=1.2,<2",
  "requests>=2.28",
  "sentencepiece>=0.1.99",
  "six>=1.16",
  "regex>=2023.3",
  "tqdm>=4.60",
  "pytorch-lightning>=2.1,<3",
  "torchmetrics>=1,<2",
  "packaging>=23",
  "safetensors>=0.4",
  "huggingface-hub>=0.23,<3",
]

[project.optional-dependencies]
notebooks = ["ipykernel", "nbclient", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["grasp*", "mole*", "DeBERTa*"]

[tool.setuptools.package-data]
"mole" = ["training/data/vocabularies/*.pkl"]
