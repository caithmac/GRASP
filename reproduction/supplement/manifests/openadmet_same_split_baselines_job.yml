apiVersion: batch/v1
kind: Job
metadata:
  generateName: anonymous-review-openadmet-baselines-
  labels:
    app: openadmet-same-split-baselines
    review/user: anonymous-review
    kueue.x-k8s.io/queue-name: REVIEW_QUEUE
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 3
  backoffLimit: 16
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: openadmet-same-split-baselines, review/user: anonymous-review}
    spec:
      restartPolicy: Never
      containers:
        - name: baseline
          image: nvcr.io/nvidia/pytorch:23.10-py3
          command: ["/bin/bash", "-c"]
          args: ["sed 's/\\r$//' /workspace/chemrasayan/run_openadmet_same_split_baselines.sh | bash -s"]
          env:
            - name: SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: NUM_SHARDS, value: "8"}
          resources:
            requests: {cpu: "8", memory: 32Gi}
            limits: {cpu: "8", memory: 32Gi}
          volumeMounts:
            - {name: nfs, mountPath: /workspace/chemrasayan, readOnly: true}
            - {name: ws, mountPath: /mnt}
      volumes:
        - name: nfs
          nfs: {server: NFS_SERVER_PLACEHOLDER, path: /EXTERNAL_NFS_PATH, readOnly: true}
        - name: ws
          persistentVolumeClaim: {claimName: WORKSPACE_PVC}
