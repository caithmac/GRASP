apiVersion: batch/v1
kind: Job
metadata:
  generateName: anonymous-review-openadmet-step2-leakage-
  labels:
    app: openadmet-step2-leakage-audit
    review/user: anonymous-review
    kueue.x-k8s.io/queue-name: REVIEW_QUEUE
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 3
  backoffLimitPerIndex: 3
  maxFailedIndexes: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: openadmet-step2-leakage-audit
        review/user: anonymous-review
    spec:
      restartPolicy: Never
      containers:
        - name: leakage-audit
          image: nvcr.io/nvidia/pytorch:23.10-py3
          command: ["/bin/bash", "-c"]
          args:
            - "sed 's/\\r$//' /workspace/chemrasayan/launch/run_openadmet_step2_leakage_audit.sh | bash -s"
          env:
            - name: SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: NUM_SHARDS, value: "12"}
            - {name: WORKERS, value: "8"}
            - {name: STEP2_DIR, value: "/mnt/data/chembl_supervised_paperlike"}
            - {name: PREPARED_DIR, value: "/mnt/data/moljepa_benchmarks/prepared"}
            - {name: OUTPUT_DIR, value: "/mnt/results_openadmet_step2_leakage_audit"}
          resources:
            requests: {cpu: "8", memory: 32Gi}
            limits: {cpu: "8", memory: 48Gi}
          volumeMounts:
            - {name: nfs, mountPath: /workspace/chemrasayan, readOnly: true}
            - {name: ws, mountPath: /mnt}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: nfs
          nfs: {server: NFS_SERVER_PLACEHOLDER, path: /EXTERNAL_NFS_PATH, readOnly: true}
        - name: ws
          persistentVolumeClaim: {claimName: WORKSPACE_PVC}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
