apiVersion: batch/v1
kind: Job
metadata:
  generateName: anonymous-review-tdc-classical-
  labels:
    kueue.x-k8s.io/queue-name: REVIEW_QUEUE
    kueue.x-k8s.io/priority-class: batch-workload-priority
    review/user: anonymous-review
    app: tdc-classical-baselines
spec:
  completions: 23
  parallelism: 2
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {review/user: anonymous-review, app: tdc-classical-baselines}
    spec:
      restartPolicy: Never
      containers:
      - name: baseline
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - "sed 's/\\r$//' /workspace/chemrasayan/launch/run_tdc_classical_baselines.sh | bash -s"
        env:
        - {name: ROOT, value: /workspace/chemrasayan}
        - {name: TDC_DATA_DIR, value: /mnt/data/tdc/raw}
        - {name: RESULTS, value: /mnt/results_tdc_classical_baselines}
        resources:
          requests: {cpu: "8", memory: "24Gi"}
          limits: {cpu: "8", memory: "24Gi"}
        volumeMounts:
        - {name: nfs, mountPath: /workspace/chemrasayan, readOnly: true}
        - {name: ws, mountPath: /mnt}
      volumes:
      - name: nfs
        nfs: {server: NFS_SERVER_PLACEHOLDER, path: /EXTERNAL_NFS_PATH, readOnly: true}
      - name: ws
        persistentVolumeClaim: {claimName: WORKSPACE_PVC}
---
apiVersion: batch/v1
kind: Job
metadata:
  generateName: anonymous-review-tdc-classical-finalize-
  labels:
    kueue.x-k8s.io/queue-name: REVIEW_QUEUE
    kueue.x-k8s.io/priority-class: batch-workload-priority
    review/user: anonymous-review
    app: tdc-classical-baselines-finalize
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {review/user: anonymous-review, app: tdc-classical-baselines-finalize}
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-results
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          deadline=$(( $(date +%s) + 21600 ))
          while [ $(find /mnt/results_tdc_classical_baselines -maxdepth 1 -name 'results_*.json' 2>/dev/null | wc -l) -lt 23 ]; do
            [ $(date +%s) -lt "$deadline" ] || { echo 'timed out waiting for 23 task results' >&2; exit 2; }
            sleep 30
          done
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "100m", memory: "128Mi"}
        volumeMounts:
        - {name: ws, mountPath: /mnt}
      containers:
      - name: finalize
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - "MODE=finalize sed 's/\\r$//' /workspace/chemrasayan/launch/run_tdc_classical_baselines.sh | MODE=finalize bash -s"
        env:
        - {name: ROOT, value: /workspace/chemrasayan}
        - {name: RESULTS, value: /mnt/results_tdc_classical_baselines}
        - {name: COMPARATOR_DIR, value: /mnt/results_chemrasayan_tdc}
        resources:
          requests: {cpu: "2", memory: "4Gi"}
          limits: {cpu: "2", memory: "4Gi"}
        volumeMounts:
        - {name: nfs, mountPath: /workspace/chemrasayan, readOnly: true}
        - {name: ws, mountPath: /mnt}
      volumes:
      - name: nfs
        nfs: {server: NFS_SERVER_PLACEHOLDER, path: /EXTERNAL_NFS_PATH, readOnly: true}
      - name: ws
        persistentVolumeClaim: {claimName: WORKSPACE_PVC}
