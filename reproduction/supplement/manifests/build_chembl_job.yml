apiVersion: batch/v1
kind: Job
metadata:
  generateName: anonymous-review-chembl-build-
  labels:
    kueue.x-k8s.io/queue-name: REVIEW_QUEUE
    review/user: anonymous-review
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: build
        image: nvcr.io/nvidia/pytorch:23.10-py3
        command: ["bash", "/workspace/chemrasayan/run_build_chembl.sh"]
        resources:
          requests:
            cpu: "8"
            memory: "64Gi"
          limits:
            cpu: "8"
            memory: "64Gi"
        volumeMounts:
        - name: nfs-code
          mountPath: /workspace/chemrasayan
          readOnly: true
        - name: ws
          mountPath: /mnt
      volumes:
      - name: nfs-code
        nfs:
          server: NFS_SERVER_PLACEHOLDER
          path: /EXTERNAL_NFS_PATH
          readOnly: true
      - name: ws
        persistentVolumeClaim:
          claimName: WORKSPACE_PVC
