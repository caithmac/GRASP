apiVersion: batch/v1
kind: Job
metadata:
  generateName: anonymous-review-phase4-atom-order-
  labels:
    app: phase4-atom-order
    review/user: anonymous-review
    kueue.x-k8s.io/queue-name: REVIEW_QUEUE
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 1
  backoffLimit: 24
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: phase4-atom-order, review/user: anonymous-review}
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: nvcr.io/nvidia/pytorch:23.10-py3
          command: ["/bin/bash", "-c"]
          args: ["sed 's/\\r$//' /workspace/chemrasayan/run_final_phase4_atom_order_audit.sh | bash -s"]
          env:
            - name: SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: NUM_SHARDS, value: "8"}
          resources:
            requests: {cpu: "8", memory: 48Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "8", memory: 48Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: nfs, mountPath: /workspace/chemrasayan, readOnly: true}
            - {name: ws, mountPath: /mnt}
            - {name: dshm, mountPath: /dev/shm}
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H200
      volumes:
        - name: nfs
          nfs: {server: NFS_SERVER_PLACEHOLDER, path: /EXTERNAL_NFS_PATH, readOnly: true}
        - name: ws
          persistentVolumeClaim: {claimName: WORKSPACE_PVC}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
