apiVersion: batch/v1
kind: Job
metadata:
  generateName: anonymous-review-15b-phase4-tdc-
  labels:
    app: mole-15b-phase4-tdc
    review/user: anonymous-review
    kueue.x-k8s.io/queue-name: REVIEW_QUEUE
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  # Retries are safe: Step 1 restores full trainer state, Step 2 restores its
  # rolling state, and completed TDC JSONs are skipped.
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: mole-15b-phase4-tdc
        review/user: anonymous-review
    spec:
      restartPolicy: Never
      # Deliberately no GPU-product selector: Kueue may admit A100-40/80,
      # H100, or H200. Local batch 32 fits the smallest eligible device.
      containers:
        - name: pipeline
          image: nvcr.io/nvidia/pytorch:23.10-py3
          command: ["/bin/bash", "-c"]
          args:
            - sed 's/\r$//' /workspace/chemrasayan/run_1.5b_phase4_to_tdc.sh | bash -s
          env:
            - name: NCCL_DEBUG
              value: WARN
            - name: PYTHONFAULTHANDLER
              value: "1"
          resources:
            requests:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: nfs
              mountPath: /workspace/chemrasayan
              readOnly: true
            - name: ws
              mountPath: /mnt
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: nfs
          nfs:
            server: NFS_SERVER_PLACEHOLDER
            path: /EXTERNAL_NFS_PATH
            readOnly: true
        - name: ws
          persistentVolumeClaim:
            claimName: WORKSPACE_PVC
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
