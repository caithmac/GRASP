# @package _global_
# RTD pre-training with mask_prob=0.25 (vs 0.15 baseline).
# Motivation: disc loss <0.02 on 15% run — task too easy with 211-token vocab.
# ELECTRA increased to 25% for same reason on large models.

name_sufix: pretrain_rtd_25pct
submit_job: True
keep_configs: False
checkpoint_path: null

logger:
  _target_: pytorch_lightning.loggers.CSVLogger
  save_dir: /mnt/logs
  name: mole_rtd_25pct

model:
  name: mole_pretrain_rtd_25pct

  data:
    trainer:
      _target_: pytorch_lightning.Trainer
      accelerator: gpu
      devices: -1
      strategy: ddp_find_unused_parameters_true
      precision: 16
      max_steps: 1000000
      log_every_n_steps: 100
      num_sanity_val_steps: 0
      gradient_clip_val: 1.0
      val_check_interval: 10000
      limit_val_batches: 0
      use_distributed_sampler: false
      benchmark: true
      callbacks:
        - _target_: pytorch_lightning.callbacks.ModelCheckpoint
          dirpath: /mnt/checkpoints/rtd_25pct
          every_n_train_steps: 100000
          save_top_k: -1
          save_last: true
          mode: min
          monitor: null
          filename: "mole_rtd_25pct-{step}"
          verbose: true
          save_weights_only: true
        - _target_: pytorch_lightning.callbacks.TQDMProgressBar
          refresh_rate: 50
      plugins:
        _target_: lightning_fabric.plugins.environments.TorchElasticEnvironment

  hyperparameters:
    datamodule:
      _target_: mole.training.data.pretrain_datasets.MolPreTrainDataModule
      data: /mnt/data/zinc_curated/
      vocabulary_inp: vocabulary_207atomenvs_radius0_ZINC_guacamole.pkl
      mask_prob: 0.25
      batch_size: 128
      num_workers: 2

    pl_module:
      _target_: mole.training.models.pretrain.MolEPreTrain
      checkpoint_path: ${checkpoint_path}

      model:
        _target_: mole.training.models.pretrain.MolERTDModel
        vocab_size_inp: null
        mask_token_id: null
        rtd_lambda: 50.0
        embedding_sharing: gdes

        gen_deberta_config:
          embedding_size: 768
          hidden_size: 256
          intermediate_size: 1024
          num_hidden_layers: 3
          num_attention_heads: 4
          attention_head_size: 64
          hidden_act: gelu
          max_position_embeddings: 512
          relative_attention: true

        disc_deberta_config:
          embedding_size: 768
          hidden_size: 768
          intermediate_size: 3072
          num_hidden_layers: 12
          num_attention_heads: 12
          attention_head_size: 64
          hidden_act: gelu
          max_position_embeddings: 512
          relative_attention: true

      optimizer:
        _target_: torch.optim.AdamW
        _partial_: true
        lr: 1.0e-4
        weight_decay: 0.01

      lr_scheduler:
        _target_: mole.training.utils.schedulers.get_cosine_schedule_with_warmup
        _partial_: true
        num_warmup_steps: 10000
        num_training_steps: 1000000

      metrics:
        _target_: mole.training.utils.metrics.MetricsDict
